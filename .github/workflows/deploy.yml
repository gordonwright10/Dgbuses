name: Nightly Data Sync & Deploy to GitHub Pages

on:
  schedule:
    # Run daily at 03:30 UTC (after Traveline TNDS overnight refresh)
    - cron: '30 3 * * *'
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Force fresh download of NaPTAN + Traveline TNDS S.zip'
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run ETL unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Compute UTC date cache key
        id: date
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore today's live timetable data cache
        id: data-cache
        if: github.event_name == 'push'
        uses: actions/cache@v4
        with:
          path: public/data
          key: tnds-680-v1-${{ steps.date.outputs.day }}-${{ hashFiles('scripts/ingest.py') }}

      - name: Fetch live NaPTAN stops & Traveline TNDS timetables
        if: steps.data-cache.outputs.cache-hit != 'true' || github.event_name == 'schedule' || inputs.force_refresh == true
        env:
          TNDS_FTP_USER: ${{ secrets.TNDS_FTP_USER }}
          TNDS_FTP_PASS: ${{ secrets.TNDS_FTP_PASS }}
        run: python3 scripts/ingest.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
